  - jekyll-include-cache

# Optional: choose a color skin (pick one you like)
minimal_mistakes_skin: "default"  # or "air", "mint", "dark", "contrast", etc.

# --- Author profile (shows in sidebar if author_profile: true) ---
author:
  name: "Sameer Panghal"
  avatar: "/assets/images/avatar.jpg"   # change or remove if you don't have this image
  bio: "Mechanical and robotics engineer at Georgia Tech."
  links:
    - label: "GitHub"
      icon: "fab fa-github"
      url: "https://github.com/spanghal23"
    - label: "LinkedIn"
      icon: "fab fa-linkedin"
      url: "https://www.linkedin.com/in/sameerpanghal/"

